<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TypeBreak — adaptive typing practice</title>
    <meta
      name="description"
      content="An adaptive typing tutor: a fixed lesson library, per-finger weakness detection, and a daily plan built only from those lessons. Works offline; your progress stays on your device."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1116" />

    <!-- Home-screen install on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TypeBreak" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">Type<span>Break</span> <small>BTS</small></div>
        <nav class="nav" id="nav" aria-label="Main">
          <a href="#/">Dashboard</a>
          <a href="#/lessons">Lessons</a>
          <a href="#/progress">Progress</a>
          <a href="#/adaptive">Adaptive</a>
          <a href="#/settings">Settings</a>
        </nav>
        <div class="sidebar-footer">
          <span id="sidebar-streak">—</span>
          <span id="sidebar-accuracy">—</span>
          <span id="sidebar-save" class="sidebar-save">Saved in this browser</span>
        </div>
      </aside>
      <main class="main">
        <div id="view" aria-live="polite">
          <div class="loading">Starting TypeBreak…</div>
        </div>
      </main>
    </div>
    <noscript>
      <p style="padding: 24px; color: #e6edf3; font-family: system-ui, sans-serif">
        TypeBreak needs JavaScript: all typing practice and progress tracking run in your browser.
      </p>
    </noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
